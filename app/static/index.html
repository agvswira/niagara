<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niagara · Meja kerja distributor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
  <link rel="stylesheet" href="/static/styles.css?v=21">
  <script>
    try { const t = localStorage.getItem("niagara-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="/static/app.js?v=22" defer></script>
</head>
<body class="signed-out">
  <a class="skip" href="#main">Langsung ke isi</a>

  <header class="mobilebar">
    <span class="wordmark">Niagara</span>
    <button type="button" class="btn btn-ghost" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true">N</span>
      <div class="side-brand-text">
        <span class="wordmark">Niagara</span>
        <span class="company" id="company"></span>
      </div>
    </div>

    <nav class="side-nav" aria-label="Halaman">
      <p class="nav-label">Kerja</p>
      <a href="#/meja" data-route="meja"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 13h4.5l1.5 3h6l1.5-3H21M5.2 5h13.6L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Meja kerja</span><span class="count" id="count-approvals"></span></a>
      <a href="#/percakapan" data-route="percakapan"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 5h16v11H10l-6 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Percakapan</span></a>
      <a href="#/order" data-route="order"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Order</span></a>
      <a href="#/stok" data-route="stok"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 7.5l9-4 9 4-9 4zM3 7.5v9l9 4 9-4v-9M12 11.5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Stok</span></a>
      <p class="nav-label">Uang</p>
      <a href="#/piutang" data-route="piutang"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Piutang</span></a>
      <a href="#/kas" data-route="kas"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3.5V7M16.5 13.5h1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kas masuk</span><span class="count" id="count-unmatched"></span></a>
      <p class="nav-label">Kendali</p>
      <a href="#/brief" data-route="brief"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 19h18M7 19a5 5 0 0 1 10 0M12 7v3M5.3 11.3l1.6 1.6M18.7 11.3l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Brief pagi</span></a>
      <a href="#/aturan" data-route="aturan"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Aturan</span></a>
    </nav>

    <section class="sim-card" aria-labelledby="sim-title">
      <p class="sim-title" id="sim-title">Waktu simulasi</p>
      <p class="sim-clock" id="clock" aria-live="polite">memuat</p>
      <button type="button" class="btn btn-block" id="advance">Maju 1 hari</button>
      <p class="sim-model" id="mode"></p>
    </section>

    <div class="side-user">
      <span class="avatar" id="user-initials" aria-hidden="true"></span>
      <div class="side-user-text">
        <span class="side-user-name" id="who"></span>
        <span class="side-user-role" id="role"></span>
      </div>
    </div>
    <div class="side-actions">
      <button type="button" class="btn btn-ghost btn-small" id="theme">Tema terang</button>
      <button type="button" class="btn btn-ghost btn-small" id="logout">Keluar</button>
    </div>
  </aside>

  <div class="content">
    <main id="main" tabindex="-1">
      <p class="state-msg">Memuat Niagara…</p>
    </main>
    <footer class="foot">
      <span>Niagara, prototipe untuk GTNIC 2026. Pelanggan, produk, dan transaksi di sini adalah data simulasi.</span>
      <button type="button" class="btn btn-ghost btn-small" id="reset" hidden>Ulang data simulasi</button>
    </footer>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <p class="sheet-crumb" id="sheet-crumb"></p>
      <h2 id="sheet-title" class="sr-only">Detail</h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Tutup panel">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </dialog>

  <dialog id="confirm" class="modal" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Konfirmasi</h2>
      <p id="confirm-text"></p>
      <div class="row-actions">
        <button type="submit" value="cancel" class="btn">Batal</button>
        <button type="submit" value="ok" class="btn btn-primary" id="confirm-ok">Ya, lanjutkan</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
